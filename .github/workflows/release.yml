name: Release
on:
  push:
    branches:
      - master

jobs:
  build:
    name: Bump and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v7

      - name: Build Application
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            bash tools/dev/build.sh standard
            bash tools/dev/build.sh unleashed
            bash tools/dev/check-sdk-drift.sh --check-only

      - name: Bump Version and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          release_branches: master
          github_token: ${{ secrets.GITHUB_TOKEN }}


      - name: Create a GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: |
            # Installation

            * Download application file for your firmware. In the release you can find 
            `flipp_pomodoro_{firmware}_{firmware_version}.fap` where:
            * * `{firmware}` - is type of firmware you use `standard` stands for official one.
            * * `{firmware_version}` - is the firmware release the app was built against, for example `1.5.1` or `unlshd-095`. Choose the asset that matches the firmware on your device.
            * Copy `flipp_pomodoro_{firmware}_{firmware_version}.fap` to SD-card of your flipper `/apps/Tools`. 
            * Run from `Applications` menu of your flipper.
            * Hint: add app to favorites and stay always productive

            So Long, and Thanks for All the Fish! 🐬 

            # Change Detail
            ${{ steps.tag_version.outputs.changelog }}
          artifacts: "dist/**"
