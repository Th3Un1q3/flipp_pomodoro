name: CI

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'flipp_pomodoro/**'
      - 'tools/dev/**'
      - 'docs/**'
      - 'justfile'
      - '.github/workflows/**'
      - '.github/dependabot.yml'

jobs:
  build:
    name: Dev container build gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build both channels in the dev container
        timeout-minutes: 25
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          runCmd: bash .devcontainer/verify.sh && bash tools/dev/build.sh unleashed
