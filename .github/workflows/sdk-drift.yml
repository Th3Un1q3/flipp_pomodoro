name: SDK drift

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check for new firmware APIs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Refresh SDKs and rebuild in the dev container
        timeout-minutes: 40
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          runCmd: |
            bash tools/dev/sdk.sh standard --force
            bash tools/dev/sdk.sh unleashed --force
            bash tools/dev/build.sh standard
            bash tools/dev/build.sh unleashed
            bash tools/dev/check-sdk-drift.sh

      - name: Report SDK drift result
        if: success()
        run: |
          if [[ -s dist/sdk-drift ]]; then
            {
              echo "## SDK drift detected"
              echo
              echo '```text'
              cat dist/sdk-drift
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## No SDK drift detected"
              echo
              echo "The baseline in tools/dev/sdk-baseline.json is unchanged."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open a PR when the API moved
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: 'docs: record new firmware versions and APIs'
          title: 'chore: firmware SDK drift'
          body: |
            A scheduled SDK refresh produced a new firmware version or API.
            The nightly job already rebuilt both channels against the new SDK.
            Updating `tools/dev/sdk-baseline.json` opens/updates this PR; GitHub
            may require approval before the `pull_request` CI run starts when
            the PR is created with `GITHUB_TOKEN`. Merging publishes fresh FAPs
            named after the new firmware version.
          add-paths: tools/dev/sdk-baseline.json
          branch: chore/sdk-api-drift
          delete-branch: true
